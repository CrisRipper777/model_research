    physical_hops: 4
    dropout: 0.2
    late_cross_dropout: 0.15
    auxiliary_ce_weight: 0.3
  A4_no_same_node:
    physical_hops: 4
    dropout: 0.2
    late_cross_dropout: 0.15
    auxiliary_ce_weight: 0.3
  H2_physical_3hop:
    physical_hops: 3
    dropout: 0.2
    late_cross_dropout: 0.15
    auxiliary_ce_weight: 0.3
