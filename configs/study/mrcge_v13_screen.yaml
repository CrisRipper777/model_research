study: mrcge_v13_view_cross_screen
protocol_version: unified_full_graph_nc_v1
datasets: [Movies, Grocery, ele-fashion]
variants: [joint_view, sender_private]
seeds: [42, 43]
backbone_condition: M_repaired
evaluate_test: false
semantic_cache: V7B.1
semantic_knn_k: 8
sender_private_ratio: 0.3
training:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.2
  epochs: 300
  patience: 30
  early_stop_min_epoch: 30
  early_stop_min_delta: 0.0001
  grad_clip: 1.0
  eval_every: 1
  inference_mode: full
  unimodal_weight: 0.3
  aux_weight: 1.0
  balance_weight: 0.01
